<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Profile Cards Project(Pseudo)</title>
    <link rel="stylesheet" href="card.css">
</head>
<body>
    <header>
        <h1>Our Staff</h1>
        <nav>
            <a href="#profile1">Sexxy Red</a>
            <a href="#profile2">Janeen</a>
            <a href="#profile3">Matt</a>
        </nav>
    </header>

    <main>
        <article id="profile1" class="card">
            <figure>
                <img src="imgs/Sexxy Red.png" alt="Sexxy Red" width="500" height="500">
                <figcaption>Sexxy Red</figcaption>
            </figure>
            <p>I'm an artist, I can sing you to ecstacy.</p>
        </article>
        <article id="profile2" class="card">
            <figure>
                <img src="imgs/Janeen.j.png" alt="Janeen Jil" width="500" height="500">
                <figcaption>Janeen <span class="nowrap">Developer Relations</span></figcaption>
            </figure>
            <p>I'm a psychologist.</p>
        </article>
        <article id="profile3" class="card">
            <figure>
                <img src="imgs/Family.png"  width="500" height="500">
                <figcaption>Family</figcaption>
            </figure>
            <p>As a man, endevor to spend Quality Time with Family</p>
        </article>
    </main>

    <a href="blog.html" id="blog">
         <button>Back to blog</button>
    </a>
    <footer>
        <p>&copy; <time id="year"></time> Acme Co.</p>
    </footer>
</body>
</html>
